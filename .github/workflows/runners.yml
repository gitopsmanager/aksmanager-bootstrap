name: Install GitOps Manager runners

# Manually dispatched. Starts the Container Apps job job-aksmanager-runners,
# which applies runners/ (GitOps Manager's runners: the hot ad-hoc pool, the
# long jobs from zero, ops alerts and State of World captures) with Terraform,
# inside Azure, as its own identity (scripts/runners-job.sh). The Azure
# counterpart of the runner step in eksmanager-bootstrap's pipeline.
#
# Run it after setup-pipeline.ps1, after a GitOps Manager sync that changes
# runners/, and after changing a runner repository variable. It runs on a
# GitHub-hosted runner because it installs ours.
#
# Repository variables (read by the job itself, not passed from here: a job
# start that carried settings could also change what the job runs):
#   RUNNER_IMAGE          the runner image, by digest, in the bootstrap's
#                         registry (required; nothing is applied without it)
#   RUNNER_CAPTURE_IMAGE  the images runners' image (State of World captures),
#                         by digest; unset: RUNNER_IMAGE, and a capture fails
#   RUNNERS_HOT, RUNNERS_MAX, RUNNERS_LONG_MAX
#                         how many runners; unset keeps the defaults (3 hot,
#                         up to 10; long jobs from 0 up to 10)
#   RUNNERS_PLAN_ONLY     "true": plan, apply nothing
#
# This workflow's identity, id-aksmanager-github, may start and stop the job
# and read its logs, nothing else. setup-pipeline.ps1 writes everything this
# reads into pinned.auto.tfvars.json.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: runners
  cancel-in-progress: false

jobs:
  run-runners-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read setup's outputs
        id: setup
        run: |
          python3 - <<'PY'
          import json, os, sys
          try:
              p = json.load(open("pinned.auto.tfvars.json"))
          except FileNotFoundError:
              sys.exit("pinned.auto.tfvars.json not found -- run setup-pipeline.ps1 first; it writes this file.")
          need = {
              "client_id":       "github_identity_client_id",
              "tenant_id":       "tenant_id",
              "subscription_id": "shared_services_subscription_id",
              "resource_group":  "shared_services_resource_group",
              "job_name":        "runners_job_name",
              "workspace_id":    "log_analytics_workspace_customer_id",
          }
          missing = [k for k in need.values() if not p.get(k)]
          if missing:
              sys.exit("pinned.auto.tfvars.json has no " + ", ".join(missing) +
                       " -- re-run setup-pipeline.ps1 (an older run did not create the runners job).")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for name, key in need.items():
                  out.write(f"{name}={p[key]}\n")
          print(f"job {p['runners_job_name']} in {p['shared_services_resource_group']}")
          PY

      - uses: azure/login@v3
        with:
          client-id: ${{ steps.setup.outputs.client_id }}
          tenant-id: ${{ steps.setup.outputs.tenant_id }}
          subscription-id: ${{ steps.setup.outputs.subscription_id }}

      - name: Start the job and wait for it
        id: run
        env:
          JOB: ${{ steps.setup.outputs.job_name }}
          RG: ${{ steps.setup.outputs.resource_group }}
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          set -euo pipefail
          execution=$(az containerapp job start --name "$JOB" --resource-group "$RG" --query name -o tsv)
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "Started $execution"

          # The job's own timeout is 45 minutes; wait a little longer.
          status=Running
          for _ in $(seq 1 100); do
            status=$(az containerapp job execution show --name "$JOB" --resource-group "$RG" \
                       --job-execution-name "$execution" --query properties.status -o tsv)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in Succeeded|Failed|Stopped|Degraded) break ;; esac
            sleep 30
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Logs reach the workspace a few minutes after the job writes them.
      - name: Job output
        if: always() && steps.run.outputs.execution != ''
        env:
          WORKSPACE: ${{ steps.setup.outputs.workspace_id }}
          EXECUTION: ${{ steps.run.outputs.execution }}
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          query="ContainerAppConsoleLogs_CL | where ContainerGroupName_s startswith '${EXECUTION}' | order by TimeGenerated asc | project Log_s"
          for _ in $(seq 1 12); do
            lines=$(az monitor log-analytics query --workspace "$WORKSPACE" --analytics-query "$query" \
                      --query "[].Log_s" -o tsv 2>/dev/null || true)
            if [ -n "$lines" ] && printf '%s\n' "$lines" | grep -q -E 'Done|ERROR:'; then break; fi
            sleep 30
          done
          if [ -n "${lines:-}" ]; then
            printf '%s\n' "$lines"
            printf '%s\n' "$lines" | grep -E 'NOTICE:|PLAN \(runners/\)|Done' >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No log lines yet -- they can take several minutes to arrive."
            echo "Query the workspace with: $query"
          fi

      - name: Result
        if: always() && steps.run.outputs.execution != ''
        run: |
          status="${{ steps.run.outputs.status }}"
          echo "Execution ${{ steps.run.outputs.execution }}: $status"
          [ "$status" = "Succeeded" ] || { echo "The runners job did not succeed."; exit 1; }
