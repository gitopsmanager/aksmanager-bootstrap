name: Run lets encrypt certificate job

# Manually dispatched. Starts the Container Apps job job-aksmanager-letsencrypt,
# which issues and renews one wildcard certificate per zone in
# hosted-zones.json and stores each in Key Vault as <prefix>-dns-zone-certs.
# The Azure counterpart of the AWS "Publish lets encrypt certificate pipeline".
#
# Run this after editing hosted-zones.json -- adding a zone, moving between
# staging and production -- or after syncing new code from the public repo.
# You do NOT need to run it for renewals: the job runs weekly on its own
# schedule, and Terraform reissues only certificates inside min_days_remaining.
#
# The certificates are issued inside Azure by the job, as its own managed
# identity. This workflow never sees them: its identity, id-aksmanager-github,
# can start and stop the job, read its logs, and give the job its TXT-only
# DNS-01 role on a zone added to hosted-zones.json -- that one role, to that
# one identity, nothing else (setup's conditional grant). Changes to
# hosted-zones.json are gated by a push ruleset restricting it to approvers.
#
# Needs no repository variables. setup-pipeline.ps1 writes everything this
# reads into pinned.auto.tfvars.json, and creates the federated credential
# that lets this repo's main branch sign in.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run-certificate-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail here rather than in the job. The job validates again with the same
      # script, but a malformed zone list is quicker to see here, and a zone
      # silently missing makes Terraform destroy that certificate and its
      # secret.
      - name: Validate hosted-zones.json
        run: python3 scripts/hosted_zones_tfvars.py hosted-zones.json "$RUNNER_TEMP/hosted-zones.auto.tfvars.json"

      - name: Read setup's outputs
        id: setup
        run: |
          python3 - <<'PY'
          import json, os, sys
          try:
              p = json.load(open("pinned.auto.tfvars.json"))
          except FileNotFoundError:
              sys.exit("pinned.auto.tfvars.json not found -- run setup-pipeline.ps1 first; it writes this file.")
          need = {
              "client_id":       "github_identity_client_id",
              "tenant_id":       "tenant_id",
              "subscription_id": "shared_services_subscription_id",
              "resource_group":  "shared_services_resource_group",
              "job_name":        "lets_encrypt_job_name",
              "workspace_id":    "log_analytics_workspace_customer_id",
          }
          missing = [k for k in need.values() if not p.get(k)]
          if missing:
              sys.exit("pinned.auto.tfvars.json has no " + ", ".join(missing) +
                       " -- re-run setup-pipeline.ps1 (an older run did not create the job).")
          # For the grant step. Optional, so a pinned file written by an older
          # setup still runs the job; the grant step then says to re-run setup.
          optional = {
              "cert_principal_id": "cert_identity_principal_id",
              "cert_dns_role":     "cert_dns_role",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for name, key in need.items():
                  out.write(f"{name}={p[key]}\n")
              for name, key in optional.items():
                  out.write(f"{name}={p.get(key) or ''}\n")
          print(f"job {p['lets_encrypt_job_name']} in {p['shared_services_resource_group']}")
          PY

      # What Azure will be shown. azure/login only says "no matching federated
      # identity record" when the token's subject differs from the credential
      # setup created; this prints the subject GitHub actually issues, beside
      # the identity it is about to be presented to. Claims only -- the token
      # itself is never printed, so this stays on for every run.
      - name: Show the sign-in claims
        env:
          CLIENT_ID: ${{ steps.setup.outputs.client_id }}
          TENANT_ID: ${{ steps.setup.outputs.tenant_id }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          url = (os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience="
                 + urllib.parse.quote("api://AzureADTokenExchange", safe=""))
          req = urllib.request.Request(
              url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          body = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
          for k in ("sub", "aud", "iss", "repository", "repository_id",
                    "repository_owner", "repository_owner_id", "ref"):
              print(f"{k:20} {claims.get(k)}")
          print(f"{'identity client id':20} {os.environ['CLIENT_ID']}")
          print(f"{'tenant':20} {os.environ['TENANT_ID']}")
          print()
          print("The federated credential on that identity must have exactly this subject:")
          print("  " + claims.get("sub", ""))
          PY

      - uses: azure/login@v2
        with:
          client-id: ${{ steps.setup.outputs.client_id }}
          tenant-id: ${{ steps.setup.outputs.tenant_id }}
          subscription-id: ${{ steps.setup.outputs.subscription_id }}

      # The job writes each zone's challenge record as its own identity, which
      # holds the TXT-only DNS-01 role per public zone. Setup grants it for the
      # zones it saw; this grants it for any zone added to hosted-zones.json
      # since, so a new zone needs no setup run.
      #
      # This identity may do exactly that and nothing else: setup gives it Role
      # Based Access Control Administrator under a condition limiting it to
      # that one role, for that one identity. Which zones reach this step is
      # gated by the repo -- the sign-in works from main only, and a push
      # ruleset restricts hosted-zones.json to approvers.
      - name: Grant DNS challenge access
        env:
          JOB_PRINCIPAL_ID: ${{ steps.setup.outputs.cert_principal_id }}
          DNS_ROLE: ${{ steps.setup.outputs.cert_dns_role }}
        run: |
          set -euo pipefail
          if [ -z "$JOB_PRINCIPAL_ID" ] || [ -z "$DNS_ROLE" ]; then
            echo "::warning::pinned.auto.tfvars.json is from an older setup, so this workflow cannot grant DNS access for new zones."
            echo "Re-run setup-pipeline.ps1 once. Zones setup already saw are unaffected."
            exit 0
          fi

          granted=0
          while IFS=$'\t' read -r zone_id zone; do
            have=$(az role assignment list --assignee-object-id "$JOB_PRINCIPAL_ID" --role "$DNS_ROLE" \
                     --scope "$zone_id" --query "[?scope=='$zone_id'] | length(@)" -o tsv)
            if [ "${have:-0}" -gt 0 ]; then
              echo "= $zone"
              continue
            fi
            az role assignment create --assignee-object-id "$JOB_PRINCIPAL_ID" --assignee-principal-type ServicePrincipal \
              --role "$DNS_ROLE" --scope "$zone_id" -o none
            echo "+ $zone: $DNS_ROLE granted"
            granted=1
          done < <(python3 - <<'PY'
          import json
          doc = json.load(open("hosted-zones.json"))
          for z in doc["hosted-zones"]:
              zone_id = (f"/subscriptions/{z['subscription']}/resourceGroups/{z['resource-group']}"
                         f"/providers/Microsoft.Network/dnszones/{z['public-dns-zone']}")
              print(f"{zone_id}\t{z['public-dns-zone']}")
          PY
          )

          # A new assignment takes a minute or two to apply, and the job would
          # otherwise meet it as AuthorizationFailed on its first TXT write.
          if [ "$granted" = 1 ]; then
            echo "Waiting 120s for the new role assignment(s) to take effect..."
            sleep 120
          fi

      - name: Start the job and wait for it
        id: run
        env:
          JOB: ${{ steps.setup.outputs.job_name }}
          RG: ${{ steps.setup.outputs.resource_group }}
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          set -euo pipefail
          execution=$(az containerapp job start --name "$JOB" --resource-group "$RG" --query name -o tsv)
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "Started $execution"

          # The job's own timeout is an hour; wait a little longer than that.
          status=Running
          for _ in $(seq 1 130); do
            status=$(az containerapp job execution show --name "$JOB" --resource-group "$RG" \
                       --job-execution-name "$execution" --query properties.status -o tsv)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in Succeeded|Failed|Stopped|Degraded) break ;; esac
            sleep 30
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Logs reach the workspace a few minutes after the job writes them, so
      # this waits for them rather than reading too early.
      - name: Job output
        if: always() && steps.run.outputs.execution != ''
        env:
          WORKSPACE: ${{ steps.setup.outputs.workspace_id }}
          EXECUTION: ${{ steps.run.outputs.execution }}
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          query="ContainerAppConsoleLogs_CL | where ContainerGroupName_s startswith '${EXECUTION}' | order by TimeGenerated asc | project Log_s"
          for _ in $(seq 1 12); do
            lines=$(az monitor log-analytics query --workspace "$WORKSPACE" --analytics-query "$query" \
                      --query "[].Log_s" -o tsv 2>/dev/null || true)
            if [ -n "$lines" ] && printf '%s\n' "$lines" | grep -q -E 'Done|ERROR:'; then break; fi
            sleep 30
          done
          if [ -n "${lines:-}" ]; then
            printf '%s\n' "$lines"
          else
            echo "No log lines yet -- they can take several minutes to arrive."
            echo "Query the workspace with: $query"
          fi

      - name: Result
        if: always() && steps.run.outputs.execution != ''
        run: |
          status="${{ steps.run.outputs.status }}"
          echo "Execution ${{ steps.run.outputs.execution }}: $status"
          [ "$status" = "Succeeded" ] || { echo "The certificate job did not succeed."; exit 1; }
